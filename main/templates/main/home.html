<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student List</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        
        

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            color: #996464;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
        font-family: "Arial Black", sans-serif;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #af281e;
        margin-bottom: 5px;
        }

        .header p {
            color: #806b6b;
            font-size: 14px;
        }

        .table-card {
            background: #ffcccc;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #af1e1e;
            color: white;
        }

        th {
            padding: 16px 20px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 17px 20px;
            border-bottom: 1px solid #eef0f3;
            font-size: 14px;
            color: #634b4b;
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: #f8faff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .name {
            color: #271111;
            font-weight: 600;
        }

        .course {
            display: inline-block;
            background: #eff6ff;
            color: #eb2525;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .age {
            color: #513737;
            font-weight: 500;
        }

        .email {
            color: #eb2525;
        }

        .empty {
            text-align: center;
            padding: 50px 20px !important;
            color: #af9c9c;
            font-style: italic;
        }

        .empty-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        @media (max-width: 700px) {
            body {
                padding: 25px 12px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 25px;
            }

            .student-count {
                align-self: stretch;
                text-align: center;
            }

            td {
                padding: 13px 15px;
            }

            th {
                font-size: 11px;
            }

            td {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <div>
                <h1>Student Table</h1>
                <p>Student Registered List</p>
            </div>
        </div>

        <div class="table-card">
            <div class="table-wrapper">

                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Age</th>
                            <th>Email</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for x in student %}
                            <tr>
                                <td class="name">
                                    {{ x.name }}
                                </td>

                                <td>
                                    <span class="course">
                                        {{ x.course }}
                                    </span>
                                </td>

                                <td class="age">
                                    {{ x.age }}
                                </td>

                                <td class="email">
                                    {{ x.email }}
                                </td>
                            </tr>

                        {% empty %}
                            <tr>
                                <td colspan="4" class="empty">
                                    <div class="empty-icon">📋</div>
                                    No students found.
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>

            </div>
        </div>

    </div>

</body>
</html>
